name: Prativerso Web — testar e publicar na Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prativerso-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Site Prativerso
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: e7feeb9fb8385b5046fbff5411499b68
      CLOUDFLARE_PAGES_PROJECT: prativerso
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Instalar as dependências fixadas
        run: pnpm install --frozen-lockfile
      - name: Verificar o código
        run: pnpm run typecheck
      - name: Compilar o site para Cloudflare Pages
        run: pnpm run build:cloudflare
      - name: Testar as funcionalidades e o login próprio
        run: |
          pnpm test
          pnpm run test:accounts
      - name: Publicar automaticamente o site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure o secret CLOUDFLARE_API_TOKEN no repositório com permissão Cloudflare Pages Edit para esta conta.'
            exit 1
          fi
          pnpm exec wrangler pages deploy dist/pages --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false --no-bundle
      - name: Confirmar a publicação e o funcionamento do site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare/verify-deployment.mjs
