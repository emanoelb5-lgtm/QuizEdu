name: Prativerso Android — compilar, testar e publicar APK e AAB

on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      QUIZEDU_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ler versão do aplicativo
        id: version
        run: node scripts/android/version.mjs >> "$GITHUB_OUTPUT"
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Obter assinatura privada com identidade do GitHub Actions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/android/sign.mjs
      - name: Compilar e verificar modelos, código e testes de interface
        run: gradle -p android --no-daemon :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :app:lintDirectDebug :app:lintPlayDebug :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest
      - name: Permitir aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar interface nativa no Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            gradle -p android --no-daemon :app:connectedDirectDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p android/store-screenshots
            adb pull /sdcard/Android/data/br.com.quizedu.app/files/store-screenshots/. android/store-screenshots/
      - name: Compilar APK direto e AAB da Google Play assinados
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle -p android --no-daemon :app:assembleDirectRelease :app:bundlePlayRelease :app:lintDirectRelease :app:lintPlayRelease
      - name: Preparar ferramenta oficial de validação do AAB
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: curl --fail --location --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output /tmp/prativerso-bundletool.jar
      - name: Verificar assinatura e preparar arquivos
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/android/package.mjs
      - name: Publicar aplicativo e pacote para a loja
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.version.outputs.version }}-build.${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.apk release-assets/*.aab release-assets/*.zip release-assets/*.txt release-assets/*.md release-assets/*.png release-assets/*.pem --clobber
          else
            gh release create "$tag" release-assets/*.apk release-assets/*.aab release-assets/*.zip release-assets/*.txt release-assets/*.md release-assets/*.png release-assets/*.pem --target "$GITHUB_SHA" --title 'Prativerso Android ${{ steps.version.outputs.version }}' --notes-file android/RELEASE_NOTES.md --latest
          fi
      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verificacoes-android
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
          if-no-files-found: ignore
      - name: Guardar capturas reais para a ficha da loja
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturas-prativerso-loja
          path: android/store-screenshots/
          if-no-files-found: ignore
      - name: Guardar APK assinado e checksum
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Prativerso-Android-Publicacao
          path: release-assets/
          retention-days: 30
      - name: Remover assinatura do runner
        if: always()
        run: node scripts/android/clean.mjs
