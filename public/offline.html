<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3155ed"><title>QuizEdu · Reconectar</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f7fc;color:#15203d;font:17px/1.6 Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:25px}main{width:100%;max-width:440px;background:#fff;border:1px solid #e0e5ef;border-radius:22px;padding:30px}img{width:56px;height:56px}h1{font-size:28px;line-height:1.2;margin:22px 0 15px}p{color:#65708a}button,a{font:700 16px Arial,sans-serif;padding:14px 18px;border-radius:12px;text-align:center;display:block;width:100%;margin:12px 0;text-decoration:none}button{background:#3155ed;color:#fff;border:0;cursor:pointer}a{background:#eaf0ff;color:#2545c2}small{display:block;font-size:14px;color:#65708a;margin-top:22px}
</style></head><body><main><img src="/favicon.svg" alt="QuizEdu"><h1>Vamos reconectar?</h1><p>O quiz ao vivo precisa de internet. Sua sala continua guardada neste aparelho; ao reconectar, você poderá voltar à partida.</p><button onclick="location.reload()">Tentar novamente</button><a id="room" hidden>Voltar à minha sala</a><small>Fechar o app não apaga os pontos já registrados pelo professor.</small></main><script>
try{const room=JSON.parse(localStorage.getItem("qe_player_room_v1")||"null");if(room&&/^\d{6}$/.test(room.code)&&Number.isFinite(room.expiresAt)&&room.expiresAt>Date.now()){const link=document.getElementById("room");link.href="/participar/"+room.code;link.textContent="Voltar à sala "+room.code;link.hidden=false;}}catch{}
window.addEventListener("online",()=>location.reload());
</script></body></html>
